# Dedicated HTTPS origin for the Notifier management UI on this appliance.
# The public DNS name needs a LAN DNS/hosts override to 192.168.124.2.
# Never proxy the Notifier event-ingress API or expose port 4321 directly.
server {
    listen 443 ssl;
    server_name notifier.qzhqzh.com;

    location / {
        return 404;
    }

    location ^~ /admin/ {
        allow 127.0.0.1;
        allow 192.168.124.0/24;
        deny all;

        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
}
